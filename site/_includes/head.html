<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="language" content="pt-BR">
<meta name="author" content="{{ site.author.name }}">
{% if site.keywords %}
<meta name="keywords" content="{{ site.keywords | join: ', ' }}">
{% endif %}
{% if page.description %}
<meta name="description" content="{{ page.description }}">
{% elsif page.subtitle %}
<meta name="description" content="{{ page.subtitle }}">
{% else %}
<meta name="description" content="{{ site.description }}">
{% endif %}
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
{% seo title=false %}
<title>{{ page.title | default: site.title }}{% if page.title and site.title != page.title %} | {{ site.title }}{% endif %}</title>
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="{{ "/assets/images/favicon.svg" | relative_url }}">
<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ "/sitemap.xml" | relative_url }}">
