---
layout: default
---

<div class="page">
  {% if page.show_title != false %}
  <header class="page-header">
    <div class="wrapper">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}
        <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </header>
  {% endif %}

  <div class="wrapper">
    <article class="page-content-wrapper">
      {{ content }}
    </article>
  </div>
</div>
